<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>NTUT ECE Roadmap</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="app">
    <header>
      <div><h1>NTUT ECE Roadmap</h1><p class="subtitle">電子工程系 · 113-batch · Y3S1 進行中 · 2028 畢業 · 目標：AI Application Engineer</p></div>
      <div class="actions"><button class="button" id="export-button">匯出規劃</button><button class="button" id="import-button">匯入規劃</button><button class="button" id="reset-button">清除已選</button></div>
    </header>
    <p id="save-status" role="status"></p>
    <section class="stats" id="stats"></section>
    <section class="done-grid" id="done-grid"></section>
    <nav class="tabs" aria-label="Roadmap sections"><button class="tab active" data-tab="history">修課紀錄</button><button class="tab" data-tab="planner">選課計劃</button><button class="tab" data-tab="credits">學分狀況</button></nav>
    <section id="history"></section><section id="planner" class="hide"></section>
    <section id="credits" class="hide"></section>
  </main>
  <dialog id="data-dialog"><h2 id="dialog-title"></h2><p id="dialog-description"></p><textarea id="data-field" spellcheck="false"></textarea><div class="dialog-actions"><button class="button" id="dialog-cancel">取消</button><button class="button primary" id="dialog-confirm">確認</button></div></dialog>

  <script defer src="data/transcripts.js"></script>
<script defer src="data/plan.js"></script>
<script defer src="assets/model.js"></script>
<script defer src="assets/storage.js"></script>
<script defer src="assets/app.js"></script>
</body>
</html>
